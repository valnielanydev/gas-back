services:
  app:
    image: mongo
    restart: always
    container_name: mongo
    command:
      [
        '--replSet',
        'rs0',
        '--bind_ip_all',
        '--keyFile',
        '/data/keyfile/mongo-keyfile',
      ]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - 27017:27017
    volumes:
      - mongo_data:/data/db
      - ./mongo-keyfile:/data/keyfile/mongo-keyfile:ro

volumes:
  mongo_data:
